{% extends "base.html" %}

{% block title %}Entrar - Flask AuthMail{% endblock %}

{% block content %}
<h2 style="font-size: 1.25rem; font-weight: 600; margin-bottom: 8px;">Acesso sem senha</h2>
<p style="color: var(--text-secondary); font-size: 0.88rem; margin-bottom: 24px;">
    Informe seu e-mail para receber um código temporário de verificação.
</p>

<form method="POST" action="{{ url_for('login') }}">
    <div class="form-group">
        <label for="email">Endereço de E-mail</label>
        <input 
            type="email" 
            id="email" 
            name="email" 
            required 
            placeholder="seu-email@exemplo.com"
            value="{{ email or '' }}"
            autocomplete="email"
            autofocus
        >
    </div>

    <button type="submit" class="btn btn-primary">
        Enviar Código de Acesso &rarr;
    </button>
</form>

<div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.06); text-align: center;">
    <p style="font-size: 0.82rem; color: var(--text-muted); margin-bottom: 10px;">
        Primeira vez testando neste banco local?
    </p>
    <a href="{{ url_for('cadastrar_teste') }}" style="font-size: 0.85rem; color: var(--primary); text-decoration: none; font-weight: 500;">
        + Criar / Verificar Usuário de Teste
    </a>
</div>
{% endblock %}
