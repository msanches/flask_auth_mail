{% extends "base.html" %}

{% block title %}Verificar Código - Flask AuthMail{% endblock %}

{% block content %}
<div style="text-align: center; margin-bottom: 20px;">
    <div style="display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; background: rgba(99, 102, 241, 0.15); border-radius: 50%; margin-bottom: 12px; color: var(--primary);">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
        </svg>
    </div>
    <h2 style="font-size: 1.25rem; font-weight: 600; margin-bottom: 6px;">Código de Verificação</h2>
    <p style="color: var(--text-secondary); font-size: 0.86rem;">
        Enviamos um código de 6 dígitos para:<br>
        <strong style="color: #ffffff;">{{ email }}</strong>
    </p>
</div>

<div style="text-align: center;">
    <span class="badge-attempts">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
        </svg>
        Máximo de 3 tentativas seguidas (bloqueio de 1h)
    </span>
</div>

<form method="POST" action="{{ url_for('verificar') }}">
    <input type="hidden" name="email" value="{{ email }}">

    <div class="form-group" style="margin-top: 14px;">
        <label for="codigo" style="text-align: center; margin-bottom: 10px;">Digite o código de 6 dígitos</label>
        <input 
            type="text" 
            id="codigo" 
            name="codigo" 
            class="otp-input"
            maxlength="6" 
            pattern="[0-9]{6}" 
            inputmode="numeric" 
            placeholder="000000" 
            required 
            autofocus
            autocomplete="one-time-code"
        >
    </div>

    <label class="checkbox-group">
        <input type="checkbox" name="lembrar" id="lembrar" value="1" checked>
        <span>Lembrar de mim neste dispositivo (manter conectado)</span>
    </label>

    <button type="submit" class="btn btn-primary">
        Verificar e Conectar &rarr;
    </button>
</form>

<form method="POST" action="{{ url_for('login') }}" style="margin-top: 12px;">
    <input type="hidden" name="email" value="{{ email }}">
    <button type="submit" class="btn btn-secondary">
        &larr; Reenviar novo código
    </button>
</form>

<div style="text-align: center; margin-top: 16px;">
    <a href="{{ url_for('login') }}" style="font-size: 0.82rem; color: var(--text-muted); text-decoration: none;">
        Trocar endereço de e-mail
    </a>
</div>
{% endblock %}
